name: SLF Admin Android APK

on:
  push:
    branches: [android-admin-build]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: slf-admin-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Android Debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android API 36
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "9.3.1"

      - name: Extract native Android project
        run: |
          mkdir -p android-admin
          tar -xzf android-admin/SLF_Admin_Android_Project.tar.gz -C android-admin

      - name: Run project checks
        working-directory: android-admin/slf-admin-android
        run: python3 tests/check_project.py

      - name: Apply CI SDK platform compatibility
        working-directory: android-admin/slf-admin-android
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("app/build.gradle.kts")
          s = p.read_text()
          if "compileSdk = 37" not in s:
              raise SystemExit("Expected compileSdk 37 not found; refusing unexpected edit")
          p.write_text(s.replace("compileSdk = 37", "compileSdk = 36", 1))
          assert "compileSdk = 36" in p.read_text()
          PY

      - name: Build APK
        run: gradle --no-daemon --stacktrace -p android-admin/slf-admin-android assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SLF-Admin-debug-APK
          path: android-admin/slf-admin-android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
