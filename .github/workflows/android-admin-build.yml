name: SLF Admin Android APK

on:
  push:
    branches: [android-admin-build]
    paths:
      - "android-admin/**"
      - ".github/workflows/android-admin-build.yml"
  workflow_dispatch:
    branches: [android-admin-build]

permissions:
  contents: read

concurrency:
  group: slf-admin-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Android Debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android API 36
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "9.3.1"

      - name: Verify source archive
        run: |
          set -euo pipefail
          xz -t android-admin/SLF_Admin_Android_Project.tar.xz
          tar -tJf android-admin/SLF_Admin_Android_Project.tar.xz > /tmp/slf-android-files.txt
          test "$(wc -l < /tmp/slf-android-files.txt)" -ge 25
          echo "Source archive valid: $(wc -l < /tmp/slf-android-files.txt) entries"

      - name: Extract native Android project
        run: |
          mkdir -p android-admin
          tar -xJf android-admin/SLF_Admin_Android_Project.tar.xz -C android-admin

      - name: Run project checks
        working-directory: android-admin/slf-admin-android
        run: python3 tests/check_project.py

      - name: Confirm Android SDK configuration
        working-directory: android-admin/slf-admin-android
        run: |
          grep -q 'compileSdk = 36' app/build.gradle.kts
          grep -q 'targetSdk = 36' app/build.gradle.kts

      - name: Build APK
        run: gradle --no-daemon --stacktrace -p android-admin/slf-admin-android assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SLF-Admin-debug-APK
          path: android-admin/slf-admin-android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
