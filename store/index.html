<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#100c18">
  <meta name="description" content="Katalog produk resmi Survival Legacy Frontier.">
  <title>Store | Survival Legacy Frontier</title>
  <link rel="stylesheet" href="/assets/css/store.css?v=20261127-catalog-rebuild">
  <link rel="stylesheet" href="/assets/css/frontier-theme.css">
  <script src="/assets/js/store-config.js" defer></script>
  <script src="/assets/js/store.js?v=20261127-catalog-rebuild" defer></script>
</head>
<body>
  <div class="topline"><b>SURVIVAL LEGACY FRONTIER</b> · STORE RESMI</div>
  <header>
    <div class="wrap nav">
      <a class="brand" href="/"><span class="mark">✦</span><span><strong>SURVIVAL LEGACY FRONTIER</strong><small>KATALOG PRODUK RESMI</small></span></a>
      <a class="btn btn-quiet" href="/">← Kembali ke Portal</a>
    </div>
  </header>
  <main>
    <section class="section" id="produk">
      <div class="wrap">
        <div class="section-head"><div class="eyebrow">SLF STORE</div><h1>Pilih Produk.</h1><p>Pilih produk untuk melihat detail atau melanjutkan ke formulir pemesanan.</p></div>
        <div class="notice" id="catalog-message" role="status" hidden></div>
        <div id="products" class="products" aria-live="polite"></div>
      </div>
    </section>
  </main>
  <footer><div class="wrap footer-inner"><span>© <span id="year"></span> Survival Legacy Frontier · Store resmi.</span><div class="footer-links"><a href="/">Portal SLF</a><a href="/bantuan/">Pusat Bantuan</a></div></div></footer>
  <dialog class="product-info-modal" id="product-info-modal" aria-labelledby="product-info-title">
    <div class="product-info-card">
      <button class="modal-close" id="product-info-close" type="button" aria-label="Tutup">×</button>
      <div class="eyebrow">Informasi produk</div><h2 id="product-info-title"></h2>
      <p class="price" id="product-info-price"></p><p id="product-info-description"></p>
      <p class="subtle" id="product-info-note"></p>
      <button class="btn btn-primary btnwide" id="product-info-donate" type="button">Donasi</button>
    </div>
  </dialog>
</body>
</html>
